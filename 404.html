<!DOCTYPE html>
<html lang="en" data-lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Not found · Loading Dose Games</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;900&family=Silkscreen&display=swap">
<style>:root {
  --paper: #17113A; --panel: #211955; --ink: #FFF6E5; --muted: #BDB4E6; --teal: #3FC1C9; --coral: #FF5D73; --amber: #FFB627; --line: #3B3180;
  --f-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --f-body: "Nunito", ui-rounded, "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 1.0625rem/1.65 var(--f-body); -webkit-font-smoothing: antialiased; }
[data-lang="en"] .tr, [data-lang="tr"] .en { display: none !important; }
.wrap { max-width: 46rem; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 1.5rem 3rem; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 2.5rem; }
.top a { color: var(--muted); text-decoration: none; font-weight: 700; }
.top a:hover { color: var(--ink); }
.lang { font: 900 .85rem var(--f-body); color: var(--ink); background: transparent; border: 2px solid var(--line); border-radius: 999px; padding: .2rem .7rem; cursor: pointer; }
.lang:hover { border-color: var(--amber); color: var(--amber); }
a:focus-visible, button:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; border-radius: 4px; }
h1 { font-family: var(--f-display); font-weight: 400; color: var(--amber); font-size: clamp(2rem, 6vw, 2.8rem); letter-spacing: .005em; line-height: 1.05; margin: 0 0 .5rem; text-wrap: balance; }
.date { color: var(--muted); margin: 0 0 2rem; }
h2 { font-family: var(--f-display); font-weight: 400; font-size: 1.45rem; letter-spacing: .01em; margin: 2.4rem 0 .5rem; text-wrap: balance; }
h3 { font-size: 1.05rem; font-weight: 900; margin: 1.5rem 0 .35rem; color: var(--teal); }
p, li { max-width: 65ch; }
ul, ol { padding-left: 1.3rem; }
li { margin-bottom: .4rem; }
a { color: var(--ink); text-decoration-color: var(--teal); text-underline-offset: .18em; overflow-wrap: anywhere; }
em { color: var(--muted); }
.summary { background: var(--panel); border: 2px solid var(--line); border-radius: 18px; padding: 1rem 1.25rem; }
.summary ul { margin: .4rem 0 0; }
.table-wrap { overflow-x: auto; margin: .75rem 0; }
table { border-collapse: collapse; width: 100%; min-width: 30rem; font-size: .95rem; }
th, td { border: 1px solid var(--line); padding: .55rem .7rem; text-align: left; vertical-align: top; }
th { background: var(--panel); color: var(--amber); font-weight: 900; }
footer { border-top: 3px solid var(--line); margin-top: 3rem; padding-top: 1.25rem; display: flex; flex-wrap: wrap; gap: .5rem 1.25rem; color: var(--muted); font-size: .9rem; }
footer a { color: var(--muted); }
.big { font-family: var(--f-display); font-size: clamp(4rem, 18vw, 8rem); line-height: 1; color: var(--coral); margin: 2rem 0 0; }
.bar { width: min(320px, 100%); height: 16px; border: 2px solid var(--line); border-radius: 999px; overflow: hidden; margin: 1rem 0 1.5rem; }
.bar i { display: block; height: 100%; width: 99%; background: var(--teal); }</style></head>
<body><div class="wrap">
<div class="top"><a href="/">← Loading Dose Games</a><button class="lang" id="langBtn" type="button" aria-label="Switch language"><span class="en">TR</span><span class="tr">EN</span></button></div>
<p class="big">404</p><div class="bar" aria-hidden="true"><i></i></div>
<h1><span class="en">Stuck at 99%</span><span class="tr">%99'da takıldı</span></h1>
<p><span class="en">This page doesn't exist. Head back to the</span><span class="tr">Bu sayfa yok. Geri dön:</span> <a href="/"><span class="en">home page</span><span class="tr">ana sayfa</span></a>.</p>
</div><script>
(function () {
  var root = document.documentElement;
  function setLang(l) { root.setAttribute('data-lang', l); root.setAttribute('lang', l); try { localStorage.setItem('ldg-lang', l); } catch (e) {} }
  var h = (location.hash || '').slice(1).toLowerCase();
  var saved = null; try { saved = localStorage.getItem('ldg-lang'); } catch (e) {}
  var nav = (navigator.language || 'en').toLowerCase();
  setLang(h === 'tr' || h === 'en' ? h : (saved || (nav.indexOf('tr') === 0 ? 'tr' : 'en')));
  window.addEventListener('hashchange', function () { var x = (location.hash || '').slice(1).toLowerCase(); if (x === 'tr' || x === 'en') setLang(x); });
  var b = document.getElementById('langBtn');
  if (b) b.addEventListener('click', function () { setLang(root.getAttribute('data-lang') === 'tr' ? 'en' : 'tr'); });
})();
</script></body></html>
